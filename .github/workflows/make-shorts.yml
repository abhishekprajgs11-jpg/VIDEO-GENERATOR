name: make-shorts

on:
  workflow_dispatch:
    inputs:
      input_url:
        description: "Direct URL to the .txt/.html question file (e.g. a Telegram file link)"
        required: true
      chat_id:
        description: "Telegram chat_id to send the finished video(s) to"
        required: true
      qpv:
        description: "Questions per video"
        required: false
        default: "5"
      timer:
        description: "Seconds per question"
        required: false
        default: "10"
      width:
        description: "Video width"
        required: false
        default: "1080"
      height:
        description: "Video height"
        required: false
        default: "1920"
      voice_idx:
        description: "Voice index"
        required: false
        default: "0"
      speed:
        description: "Playback speed"
        required: false
        default: "1.0"
      show_expl:
        description: "Show explanation flag"
        required: false
        default: ""
      workers:
        description: "Parallel workers"
        required: false
        default: "2"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow pywin32 static-ffmpeg numpy requests

      - name: Download input file
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "${{ github.event.inputs.input_url }}" -OutFile input.txt

      - name: Run V5 engine (headless)
        run: |
          python run_cli.py input.txt out --qpv ${{ github.event.inputs.qpv }} --timer ${{ github.event.inputs.timer }} --width ${{ github.event.inputs.width }} --height ${{ github.event.inputs.height }} --voice-idx ${{ github.event.inputs.voice_idx }} --speed ${{ github.event.inputs.speed }} --workers ${{ github.event.inputs.workers }} ${{ github.event.inputs.show_expl }}

      - name: Send videos to Telegram
        shell: pwsh
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
        run: |
          python send_to_telegram.py out
